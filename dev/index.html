<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Report Generator — Dev Mode (Mock API)</title>
<link rel="stylesheet" href="../app/css/addin.css">
<style>
    /* Dev-only chrome that mimics MyGeotab's shell. NOT part of the Add-In. */
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        background: #f5f7f9;
    }
    .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 250px 1fr;
    }
    .sidebar {
        background: #fff;
        border-right: 1px solid #dfe5eb;
        padding: 22px 14px;
        display: flex;
        flex-direction: column;
    }
    .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 2px 10px 25px;
    }
    .brand-icon {
        width: 38px;
        height: 38px;
        border-radius: 9px;
        background: #1976d2;
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 18px;
    }
    .brand-title { font-size: 14px; font-weight: 750; line-height: 1.25; }
    .brand-sub { font-size: 11px; color: #697786; margin-top: 2px; }
    .nav-label {
        padding: 0 12px 8px;
        color: #8a96a3;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
    }
    .nav-item {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 10px 12px;
        border-radius: 7px;
        color: #536170;
        font-size: 13px;
        margin-bottom: 3px;
    }
    .nav-item.active { background: #eaf3fc; color: #1976d2; font-weight: 700; }
    .sidebar-bottom { margin-top: auto; padding: 12px; border-top: 1px solid #dfe5eb; }
    .db-status { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #697786; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #168a4b; }
    .topbar {
        height: 62px;
        background: #fff;
        border-bottom: 1px solid #dfe5eb;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
    }
    .breadcrumb { font-size: 12px; color: #697786; }
    .breadcrumb strong { color: #17212b; }
    .user-area { display: flex; align-items: center; gap: 13px; font-size: 12px; }
    .user-avatar {
        width: 31px; height: 31px; border-radius: 50%;
        background: #e9eef4; display: grid; place-items: center;
        font-size: 11px; font-weight: 700;
    }
    @media (max-width: 1050px) {
        .app { grid-template-columns: 210px 1fr; }
    }
    @media (max-width: 760px) {
        .app { display: block; }
        .sidebar { display: none; }
    }
</style>
</head>
<body>
<div class="app">

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">GR</div>
            <div>
                <div class="brand-title">Fleet Report<br>Generator</div>
                <div class="brand-sub">MyGeotab Add-In</div>
            </div>
        </div>
        <div class="nav-label">Report</div>
        <div class="nav-item active">Report Builder</div>
        <div class="nav-item">Report Preview</div>
        <div class="nav-label" style="margin-top:18px;">System</div>
        <div class="nav-item">Settings</div>
        <div class="nav-item">Help &amp; API Info</div>
        <div class="sidebar-bottom">
            <div class="db-status"><span class="dot"></span> Mock MyGeotab connected</div>
        </div>
    </aside>

    <main>
        <header class="topbar">
            <div class="breadcrumb">MyGeotab &nbsp;/&nbsp; <strong>Fleet Report Generator</strong></div>
            <div class="user-area">
                <span>Fleet Administrator</span>
                <div class="user-avatar">FA</div>
            </div>
        </header>
        <div id="fleetReportGenerator"></div>
    </main>

</div>

<script src="mock/fixtures.js"></script>
<script src="mock/mockApi.js"></script>
<script src="mock/mockState.js"></script>

<script src="../app/scripts/core/frgBase.js"></script>
<script src="../app/scripts/core/dateTime.js"></script>
<script src="../app/scripts/core/errorHandler.js"></script>
<script src="../app/scripts/core/apiClient.js"></script>
<script src="../app/scripts/modules/registry.js"></script>
<script src="../app/scripts/modules/deviceStatus/deviceStatusModule.js"></script>
<script src="../app/scripts/core/reportController.js"></script>
<script src="../app/scripts/render/reportRenderer.js"></script>
<script src="../app/scripts/render/uiBuilder.js"></script>
<script src="../app/scripts/main.js"></script>
<script src="bootstrap.js"></script>
</body>
</html>
